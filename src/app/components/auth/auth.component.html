<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-200 to-blue-900 relative overflow-hidden">
  <!-- Background Pattern (SVG inline as utility class) -->
  <div class="absolute inset-0 bg-[url('data:image/svg+xml,%3Csvg width=\'60\' height=\'60\' viewBox=\'0 0 60 60\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cg fill=\'none\' fill-rule=\'evenodd\'%3E%3Cg fill=\'%23ffffff\' fill-opacity=\'0.05\'%3E%3Cpath d=\'M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z\'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E')] bg-repeat z-0"></div>

  <div class="relative z-10 w-full max-w-md bg-white rounded-2xl p-8 shadow-xl animate-fade-in-up">
    <!-- Logo -->
    <div class="text-center mb-6">
      <div class="w-16 h-16 mx-auto mb-3 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center shadow-lg transform transition-transform hover:scale-105">
        <!-- Chat icon (SVG) -->
        <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20">
          <path d="M18 13a1 1 0 01-1 1H6l-4 4V4a1 1 0 011-1h14a1 1 0 011 1v9z"/>
        </svg>
      </div>
      <h3 class="text-xl font-bold text-gray-800 mb-1">Welcome Back</h3>
      <p class="text-gray-500">Sign in to continue</p>
    </div>

    <!-- Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      <!-- Name Input -->
      <div class="mb-4">
        <label for="name" class="block text-sm font-semibold text-gray-700 mb-1">
          Full Name
        </label>
        <input
          id="name"
          type="text"
          formControlName="name"
          placeholder="Enter your name"
          autocomplete="name"
          class="w-full px-4 py-2 border rounded-lg focus:outline-none transition-all duration-200
            border-gray-300 focus:border-indigo-500
            invalid:border-red-500
            "
          [class.border-green-500]="loginForm.get('name')?.touched && loginForm.get('name')?.valid"
          [class.border-red-500]="loginForm.get('name')?.touched && loginForm.get('name')?.invalid"
        />
        <div class="text-sm text-red-600 mt-1" *ngIf="loginForm.get('name')?.touched && loginForm.get('name')?.errors?.['required']">
          Name is required
        </div>
        <div class="text-sm text-red-600 mt-1" *ngIf="loginForm.get('name')?.touched && loginForm.get('name')?.errors?.['minlength']">
          Name must be at least 2 characters
        </div>
      </div>

      <!-- Email Input -->
      <div class="mb-6">
        <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">
          Email Address
        </label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="Enter your email"
          autocomplete="email"
          class="w-full px-4 py-2 border rounded-lg focus:outline-none transition-all duration-200
            border-gray-300 focus:border-indigo-500
            invalid:border-red-500
            "
          [class.border-green-500]="loginForm.get('email')?.touched && loginForm.get('email')?.valid"
          [class.border-red-500]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
        />
        <div class="text-sm text-red-600 mt-1" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['required']">
          Email is required
        </div>
        <div class="text-sm text-red-600 mt-1" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['email']">
          Please enter a valid email
        </div>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="w-full py-2.5 bg-gradient-to-br from-indigo-500 to-purple-600 text-white font-semibold rounded-lg shadow-md transition hover:from-indigo-600 hover:to-purple-700 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center"
        [disabled]="loginForm.invalid || loading"
      >
        <svg *ngIf="loading" class="w-5 h-5 mr-2 animate-spin text-white" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4l3.5-3.5L12 0v4a8 8 0 010 16v-4l-3.5 3.5L12 24v-4a8 8 0 01-8-8z"></path>
        </svg>
        <span *ngIf="!loading" class="mr-2">→</span>
        {{ loading ? 'Signing in...' : 'Continue to Chat' }}
      </button>

      <!-- Error Message -->
      <div *ngIf="errorMessage" class="mt-4 bg-red-100 text-red-700 border border-red-300 px-4 py-3 rounded relative flex items-start justify-between">
        <div class="flex-1 text-sm">{{ errorMessage }}</div>
        <button (click)="errorMessage = ''" type="button" class="ml-4 text-red-600 hover:text-red-800 text-xs font-bold">
          ×
        </button>
      </div>
    </form>

    <!-- Footer -->
    <div class="text-center mt-6 text-sm text-gray-500">
      By continuing, you agree to our
      <a href="#" class="text-indigo-600 hover:underline">Terms</a> and
      <a href="#" class="text-indigo-600 hover:underline">Privacy Policy</a>
    </div>
  </div>
</div>
