<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-zinc-950 via-slate-900 to-zinc-950 relative overflow-hidden p-4 sm:p-6 lg:p-8">
  <!-- Animated Background Pattern -->
  <div class="absolute inset-0 overflow-hidden">
    <div class="absolute -top-1/2 -right-1/2 w-full h-full bg-gradient-to-br from-blue-600/10 to-purple-600/10 rounded-full blur-3xl animate-pulse"></div>
    <div class="absolute -bottom-1/2 -left-1/2 w-full h-full bg-gradient-to-tr from-blue-500/10 to-cyan-500/10 rounded-full blur-3xl animate-pulse delay-1000"></div>
  </div>

  <!-- Login Card -->
  <div class="relative z-10 w-full max-w-md">
    <div class="bg-zinc-900/80 backdrop-blur-xl rounded-3xl p-8 sm:p-10 shadow-2xl border border-zinc-800">
      <!-- Logo & Header -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 sm:w-18 sm:h-18 mb-4 bg-gradient-to-br from-blue-600 to-purple-600 rounded-2xl shadow-lg shadow-blue-500/20 transform transition-all duration-300 hover:scale-110 hover:rotate-3">
          <svg class="w-8 h-8 sm:w-9 sm:h-9 text-white" fill="currentColor" viewBox="0 0 20 20">
            <path d="M2 5a2 2 0 012-2h7a2 2 0 012 2v4a2 2 0 01-2 2H9l-3 3v-3H4a2 2 0 01-2-2V5z"/>
            <path d="M15 7v2a4 4 0 01-4 4H9.828l-1.766 1.767c.28.149.599.233.938.233h2l3 3v-3h2a2 2 0 002-2V9a2 2 0 00-2-2h-1z"/>
          </svg>
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold text-white mb-2">Welcome Back</h1>
        <p class="text-sm sm:text-base text-gray-400">Sign in to continue your conversation</p>
      </div>

      <!-- Form -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate class="space-y-5">
        <!-- Name Input -->
        <div>
          <label for="name" class="block text-sm font-semibold text-gray-300 mb-2">
            Full Name
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <svg class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
            </div>
            <input
              id="name"
              type="text"
              formControlName="name"
              placeholder="Enter your full name"
              autocomplete="name"
              class="w-full pl-12 pr-4 py-3 sm:py-3.5 border rounded-xl text-sm sm:text-base focus:outline-none transition-all duration-200 bg-zinc-800/50 text-white placeholder-gray-500"
              [ngClass]="{
                'border-zinc-700 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20': !loginForm.get('name')?.touched,
                'border-emerald-500 bg-emerald-500/10 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20': loginForm.get('name')?.touched && loginForm.get('name')?.valid,
                'border-red-500 bg-red-500/10 focus:border-red-500 focus:ring-2 focus:ring-red-500/20': loginForm.get('name')?.touched && loginForm.get('name')?.invalid
              }"
            />
            <!-- Success Icon -->
            <div *ngIf="loginForm.get('name')?.touched && loginForm.get('name')?.valid" class="absolute inset-y-0 right-0 pr-4 flex items-center">
              <svg class="h-5 w-5 text-emerald-500" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
              </svg>
            </div>
          </div>
          <!-- Error Messages -->
          <div *ngIf="loginForm.get('name')?.touched && loginForm.get('name')?.errors" class="mt-2 text-xs sm:text-sm text-red-400 flex items-start gap-1">
            <svg class="h-4 w-4 mt-0.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
            </svg>
            <span *ngIf="loginForm.get('name')?.errors?.['required']">Name is required</span>
            <span *ngIf="loginForm.get('name')?.errors?.['minlength']">Name must be at least 2 characters</span>
          </div>
        </div>

        <!-- Email Input -->
        <div>
          <label for="email" class="block text-sm font-semibold text-gray-300 mb-2">
            Email Address
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <svg class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
              </svg>
            </div>
            <input
              id="email"
              type="email"
              formControlName="email"
              placeholder="you@example.com"
              autocomplete="email"
              class="w-full pl-12 pr-4 py-3 sm:py-3.5 border rounded-xl text-sm sm:text-base focus:outline-none transition-all duration-200 bg-zinc-800/50 text-white placeholder-gray-500"
              [ngClass]="{
                'border-zinc-700 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20': !loginForm.get('email')?.touched,
                'border-emerald-500 bg-emerald-500/10 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20': loginForm.get('email')?.touched && loginForm.get('email')?.valid,
                'border-red-500 bg-red-500/10 focus:border-red-500 focus:ring-2 focus:ring-red-500/20': loginForm.get('email')?.touched && loginForm.get('email')?.invalid
              }"
            />
            <!-- Success Icon -->
            <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.valid" class="absolute inset-y-0 right-0 pr-4 flex items-center">
              <svg class="h-5 w-5 text-emerald-500" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
              </svg>
            </div>
          </div>
          <!-- Error Messages -->
          <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors" class="mt-2 text-xs sm:text-sm text-red-400 flex items-start gap-1">
            <svg class="h-4 w-4 mt-0.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
            </svg>
            <span *ngIf="loginForm.get('email')?.errors?.['required']">Email is required</span>
            <span *ngIf="loginForm.get('email')?.errors?.['email']">Please enter a valid email</span>
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="w-full py-3.5 sm:py-4 bg-gradient-to-r from-blue-600 to-purple-600 text-white font-semibold rounded-xl shadow-lg shadow-blue-500/30 transition-all duration-200 flex items-center justify-center gap-2 hover:shadow-blue-500/50 hover:scale-[1.02] active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100"
          [disabled]="loginForm.invalid || loading"
        >
          <svg *ngIf="loading" class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span class="text-base sm:text-lg">{{ loading ? 'Signing in...' : 'Continue to Chat' }}</span>
          <svg *ngIf="!loading" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
          </svg>
        </button>

        <!-- Error Alert -->
        <div *ngIf="errorMessage" class="mt-4 bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-3 rounded-xl flex items-start gap-3 animate-fade-in">
          <svg class="h-5 w-5 text-red-500 mt-0.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
          </svg>
          <span class="flex-1 text-sm">{{ errorMessage }}</span>
          <button (click)="errorMessage = ''" type="button" class="text-red-500 hover:text-red-400 transition-colors">
            <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
            </svg>
          </button>
        </div>
      </form>

      <!-- Footer -->
      <div class="text-center mt-8 pt-6 border-t border-zinc-800">
        <p class="text-xs sm:text-sm text-gray-400">
          By continuing, you agree to our
          <a href="#" class="text-blue-500 hover:text-blue-400 font-medium transition-colors">Terms</a> and
          <a href="#" class="text-blue-500 hover:text-blue-400 font-medium transition-colors">Privacy Policy</a>
        </p>
      </div>
    </div>
  </div>
</div>
